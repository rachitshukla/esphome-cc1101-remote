esphome:
  name: string-lights-radio
  friendly_name: String Lights Radio
  on_boot:
    priority: -100
    then:
      - cc1101.set_idle
      - lambda: id(ready_for_commands) = true;

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret string_lights_api_key

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  output_power: 0

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.set_idle

globals:
  - id: ready_for_commands
    type: bool
    initial_value: 'false'

output:
  - platform: template
    id: rf_light_output
    type: binary
    write_action:
      - if:
          condition:
            lambda: return id(ready_for_commands);
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                code: !lambda |-
                  return state ? "00110010010011111001110000011101"
                               : "00110010010011111010001100100100";
                protocol: 1
                repeat:
                  times: 5
                  wait_time: 0us

light:
  - platform: binary
    name: Outdoor String Lights
    output: rf_light_output
    restore_mode: RESTORE_DEFAULT_OFF
