esphome:
  includes: [packages/minka.h]

api:
  actions:
    - action: minka_light_hold
      variables:
        brighten: bool
        pressed: bool
      then:
        - lambda: |-
            if (!id(ready_for_commands)) return;
            const int command = brighten ? minka::BRIGHTEN : minka::DIM;
            if (pressed) {
              if (id(held_command) == 0) id(hold_minka_light).execute(command);
            } else if (id(held_command) == command) {
              id(stop_minka_hold).execute();
            }

script:
  - id: send_minka
    parameters:
      command: int
      frames: int
      release: bool
    then:
      - if:
          condition:
            lambda: return id(ready_for_commands);
          then:
            - globals.set: {id: next_tx_hz, value: '303875000'}
            - remote_transmitter.transmit_raw:
                code: !lambda return minka::waveform(command, frames, release);
                carrier_frequency: 0Hz

  - id: finish_minka_hold
    then:
      - lambda: |-
          if (id(hold_on_air)) id(send_minka).execute(0, 0, true);
          id(hold_on_air) = false;
          id(held_command) = 0;

  - id: stop_minka_hold
    then:
      - script.stop: hold_minka_light
      - script.execute: finish_minka_hold

  - id: hold_minka_light
    parameters:
      command: int
    then:
      - lambda: id(held_command) = command;
      # A brief touch on a brightness control should leave power alone.
      - delay: 250ms
      - lambda: |-
          id(hold_on_air) = true;
          id(send_minka).execute(command, 21, false);
      - delay: 490ms
      # Each group lasts ~96 ms. Start the next just before the current
      # group finishes; the transmitter waits for the last frame on air.
      # The bounded repeat also releases the key if the client disappears.
      - repeat:
          count: 55
          then:
            - lambda: id(send_minka).execute(command, 4, false);
            - delay: 90ms
      - script.execute: finish_minka_hold

globals:
  - id: held_command
    type: int
    initial_value: '0'
  - id: hold_on_air
    type: bool
    initial_value: 'false'
  - id: lamp_on
    type: bool
    initial_value: 'false'

fan:
  - platform: template
    id: minka_fan
    name: Minka Aire Fan
    device_id: bedroom_fan
    speed_count: 3
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - script.execute: stop_minka_hold
      - script.execute:
          id: send_minka
          command: !lambda return minka::fan_command(x->state, x->speed);
          frames: 7
          release: true

output:
  - platform: template
    id: minka_light_output
    type: binary
    write_action: []

light:
  - platform: binary
    id: minka_light
    name: Minka Aire Fan Light
    device_id: bedroom_fan
    output: minka_light_output
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - lambda: |-
          const bool on = id(minka_light).remote_values.is_on();
          if (on == id(lamp_on)) return;
          id(lamp_on) = on;
          if (!id(ready_for_commands)) return;
          id(stop_minka_hold).execute();
          id(send_minka).execute(minka::BRIGHTEN, minka::TAP_FRAMES, true);
