substitutions:
  # Three Brighten loops took ~6 s. Leave one RF frame (~24 ms) for the wrap.
  minka_ramp_ms: "1976"
  minka_hold_lead_ms: "300"  # Initial estimate for tap-to-hold recognition

esphome:
  includes: [packages/minka.h]

script:
  - id: send_minka
    parameters:
      command: int
      frames: int
    then:
      - if:
          condition:
            lambda: return id(ready_for_commands);
          then:
            - globals.set:
                id: next_tx_hz
                value: '303875000'
            - remote_transmitter.transmit_raw:
                code: !lambda return minka::waveform(command, frames);
                carrier_frequency: 0Hz

  - id: apply_fan_light
    mode: single
    then:
      - delay: 150ms
      - while:
          condition:
            lambda: |-
              using Timing = minka::Dimmer<${minka_ramp_ms}, ${minka_hold_lead_ms}>;
              const auto &target = id(minka_light).remote_values;
              return Timing::pending({id(lamp_on), id(lamp_level)}, target.is_on(), target.get_brightness());
          then:
            - lambda: |-
                using Timing = minka::Dimmer<${minka_ramp_ms}, ${minka_hold_lead_ms}>;
                const auto &target = id(minka_light).remote_values;
                minka::LampEstimate lamp{id(lamp_on), id(lamp_level)};
                auto press = Timing::next(lamp, target.is_on(), target.get_brightness());
                id(send_minka).execute(press.command, press.frames);
                id(lamp_on) = lamp.on;
                id(lamp_level) = lamp.brightness;
                // Allow both release frames and a gap before the next press.
                id(lamp_wait_ms) = (press.frames + minka::RELEASE_FRAMES) * minka::FRAME_US / 1000 + 120;
            - delay: !lambda return id(lamp_wait_ms);

globals:
  - id: lamp_on
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: lamp_level
    type: uint8_t
    restore_value: true
    initial_value: '255'
  - id: lamp_wait_ms
    type: int
    initial_value: '0'

fan:
  - platform: template
    id: minka_fan
    name: Minka Aire Fan
    speed_count: 3
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - script.execute:
          id: send_minka
          command: !lambda return minka::fan_command(x->state, x->speed);
          frames: 7

output:
  - platform: template
    id: minka_light_output
    type: float
    # Handle the requested state once below, including HA transition requests.
    write_action: []

light:
  - platform: monochromatic
    id: minka_light
    name: Minka Aire Fan Light
    output: minka_light_output
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s
    gamma_correct: 1.0
    on_state:
      - if:
          condition:
            lambda: return id(ready_for_commands) && !id(apply_fan_light).is_running();
          then:
            - script.execute: apply_fan_light
