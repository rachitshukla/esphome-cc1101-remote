substitutions:
  rx_frequency: 433.92MHz
  rx_modulation: ASK/OOK
  rx_bandwidth: 203kHz

esphome:
  name: fan-rf-receive
  on_boot:
    priority: -100
    then:
      - cc1101.begin_rx
      - logger.log: "RF capture listening at ${rx_frequency} using ${rx_modulation}, nominal bandwidth ${rx_bandwidth}"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 115200

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: radio
  cs_pin: GPIO5
  frequency: ${rx_frequency}
  modulation_type: ${rx_modulation}
  filter_bandwidth: ${rx_bandwidth}
  packet_mode: false

remote_receiver:
  pin: GPIO27
  dump: [raw, rc_switch]
  filter: 100us
  idle: 8ms

# Log the strongest sampled signal each second, including quiet periods.
interval:
  - interval: 20ms
    then:
      - lambda: |-
          static float peak = -150.0f;
          static uint32_t last_report = 0;
          if (id(radio)->is_failed()) return;
          id(radio)->enable();
          id(radio)->transfer_byte(0xF4);
          const int raw = id(radio)->transfer_byte(0);
          id(radio)->disable();
          const int value = raw < 128 ? raw : raw - 256;
          const float dbm = value * 0.5f - 74.0f;
          if (dbm > peak) peak = dbm;
          const uint32_t now = millis();
          if (now - last_report >= 1000) {
            ESP_LOGI("signal", "ms=%u peak_dBm=%.1f", static_cast<unsigned>(now), peak);
            peak = -150.0f;
            last_report = now;
          }
